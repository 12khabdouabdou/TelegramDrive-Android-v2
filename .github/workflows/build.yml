name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run ktlint check
        run: ./gradlew ktlintCheck --no-daemon
        continue-on-error: true # ignoreFailures=true in build.gradle.kts for now

      - name: Verify Room v9 schema export
        run: |
          if [ ! -s core/db/schemas/com.tgdrive.core.db.TgDriveDatabase/9.json ]; then
            ./gradlew :core:db:kspDebugKotlin --rerun-tasks --no-daemon
          fi
          test -s core/db/schemas/com.tgdrive.core.db.TgDriveDatabase/9.json
          ls -lh core/db/schemas/com.tgdrive.core.db.TgDriveDatabase/9.json

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: core/db/schemas/com.tgdrive.core.db.TgDriveDatabase/*.json
          retention-days: 7

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon
        continue-on-error: true

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APKs (arm64-v8a + universal)
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/*.apk
          if ls app/build/outputs/apk/debug/*armeabi-v7a* app/build/outputs/apk/debug/*x86* 2>/dev/null; then
            echo "Unexpected non-ARMv8 ABI split APK produced" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*-arm64-v8a-*.apk
            app/build/outputs/apk/debug/*-universal-*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Decode optional release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"
            echo "path=${{ runner.temp }}/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs (arm64-v8a + universal, R8 check)
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/*.apk
          if ls app/build/outputs/apk/release/*armeabi-v7a* app/build/outputs/apk/release/*x86* 2>/dev/null; then
            echo "Unexpected non-ARMv8 ABI split APK produced" >&2
            exit 1
          fi

      - name: Clean up temporary keystore
        if: always() && steps.keystore.outputs.path != ''
        run: rm -f "${{ steps.keystore.outputs.path }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/*-arm64-v8a-*.apk
            app/build/outputs/apk/release/*-universal-*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 7
