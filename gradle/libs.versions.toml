hiltWork = "1.2.0"
composeBom = "2024.09.03"
activityCompose = "1.9.2"
lifecycle = "2.8.6"
navCompose = "2.8.1"
coroutines = "1.9.0"
room = "2.7.0"
datastore = "1.1.1"
workManager = "2.10.0"
coil = "2.7.0"
exoplayer = "1.4.1"
mlkitTextRecognition = "16.0.1"
mlkitImageLabeling = "17.0.9"
tdlight = "3.5.3+td.1.8.65"
securityCrypto = "1.1.0-alpha06"
biometric = "1.2.0-alpha05"
documentfile = "1.0.1"
